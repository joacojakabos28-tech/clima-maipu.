name: Alertas del clima
on:
  schedule:
    - cron: "0 */3 * * *"     # alertas cada 3 horas
    - cron: "30 10 * * *"     # resumen diario 07:30 hora Argentina
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enviar:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      FAMILIA: ${{ secrets.FAMILIA }}
      MODE: ${{ github.event.schedule == '30 10 * * *' && 'resumen' || 'alertas' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python alertas.py
      - name: Guardar estado
        run: |
          git config user.name "clima-bot"; git config user.email "bot@users.noreply.github.com"
          git add estado.json && (git diff --cached --quiet || git commit -m "estado" && git push) || true
 
